# Tests and builds every push to main and every pull request, then runs JetBrains' Plugin Verifier
# against the recommended IDE versions. The built plugin zip is kept as a workflow artifact.
name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew test buildPlugin verifyPluginStructure

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The verifier downloads several full IDEs
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier
