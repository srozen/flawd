pluginGroup = io.github.srozen.flawd
pluginName = Flawd BPMN Editor
pluginVersion = 0.1.0

# Marketplace vendor; the name must match your vendor profile on plugins.jetbrains.com.
# Email and URL are shown publicly on the listing; publishPlugin refuses to run until one is set.
pluginVendorName = Srozen
pluginVendorEmail = spat.monroe@gmail.com
pluginVendorUrl = https://github.com/srozen/flawd

# Oldest IDE build the plugin declares compatibility with
pluginSinceBuild = 262

# IDE the plugin is compiled and run against. To skip the download and use an installed IDE instead, set
# platformLocalPath (e.g. in ~/.gradle/gradle.properties or with -PplatformLocalPath=...):
# platformLocalPath = /Users/you/Applications/IntelliJ IDEA.app
platformVersion = 2026.2.4

# npm executable used to build the web editor (use an absolute path if Gradle can't find it on PATH)
npmCommand = npm

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
